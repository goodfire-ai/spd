# No project here: the repository is one directory per project (`param_decomp/`,
# `param_decomp_formats/`), each with its own pyproject.toml. This file holds the tool
# config the projects share, run from the repository root in the library's environment
# (the Makefile's targets): ruff, basedpyright and pytest.

[tool.ruff]
line-length = 100
# Where first-party imports are found: the root and the library's project directory, so
# `param_decomp` stays first-party.
src = [".", "param_decomp"]
fix = true
extend-exclude = ["**/_scratch", "**/*_pb2.py", "**/*_pb2.pyi"]

[tool.ruff.lint]
ignore = [
    "F722", # Incompatible with jaxtyping
    "E731", # I think lambda functions are fine in several places
    "E501", # there are a lot of long lines in the codebase
]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.pyright]
# nano_param_decomp/ is the standalone torch single-file VPD reference impl for paper
# readers (see README); it is the one torch island left in the repo and is type-checked
# in a torch env, not this JAX-only one.
# `target_ports` is a verbatim numeric mirror of the torch vendored Llama — kept out of
# type-checking (its correctness contract is the parity tests, not types).
# `routed/experts.py` is kept out for the same reason (its contract is the
# dense-reference oracle tests): its pallas kernel bodies and tokamax calls are untyped
# at the source. The `routed` tests stay type-checked.
include = ["param_decomp/param_decomp"]
exclude = [
    "**/wandb/**",
    "**/_scratch/**",
    "**/node_modules/**",
    "**/__pycache__",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "nano_param_decomp",
    "param_decomp/param_decomp/routed/experts.py",
    "param_decomp/param_decomp/target_ports",
    "param_decomp/param_decomp/tests/targets/qwen3_hf_parity/gen_hf_fixtures.py",  # torch-env script
    "param_decomp/param_decomp/tests/targets/qwen36_moe_hf_parity/gen_hf_fixtures.py",  # torch-env script
    "param_decomp/param_decomp/tests/targets/stacked_parity/gen_stacked_fixtures.py",  # base-branch-only script (pre-restructure API)
]
stubPath = "typings" # Having type stubs for transformers shaves 10 seconds off basedpyright calls
# Each project's files import its packages from its directory, as its environment does
# (setuptools' editable installs are import hooks, which pyright does not follow).
executionEnvironments = [{ root = "param_decomp" }]

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportFunctionMemberAccess = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
reportPrivateImportUsage = false
# basedpyright
reportCallIssue = true
reportAny = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportImplicitStringConcatenation = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownLambdaType = false



[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    # https://github.com/google/python-fire/pull/447
    "ignore::DeprecationWarning:fire:59",
]
