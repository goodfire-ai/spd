name: Checks
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - "**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Guard the requires-python floor: downstream consumers deploy on Python 3.12, so
  # the package must stay importable there. The full suite
  # runs on 3.13 in the build shards below.
  python-312-compat:
    name: python 3.12 compat (import smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --python 3.12
      - name: Import smoke
        run: |
          uv run python -c "import param_decomp.core.built_run; from param_decomp.core.components import SiteSpec"
          uv run python -c "import param_decomp.experiments.lm.run, param_decomp.pretrain.train"

  build:
    # The test suite is sharded across parallel jobs (an exact partition — see the
    # test-ci-* Makefile targets): one job running everything overruns the job timeout,
    # and a timed-out job never saves its JAX compile cache, leaving every later run
    # cold and slower still.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - llama-goldens
          - core-engine
          - core-targets
          - lab-lm
          - lab-pipeline
          - multidevice-placement
          - multidevice-worlds
          - multidevice-routed
          - multidevice-evals
          - multidevice-substrate
    name: build (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/ci-mpi:latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Container runs as different user than repo owner, causing "dubious ownership" errors.
      # Tests that run subprocesses (e.g. test_distributed.py) need git commands to work.
      - name: Configure git safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make install-ci

      - name: Print dependencies
        run: uv pip list

      - name: Cache HuggingFace downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            hf-

      # JAX's disk cache is content-addressed by HLO, backend, and JAX/XLA version;
      # conftest.py caps CPU ISA at AVX2, so the broad restore prefixes are safe. GitHub
      # cache keys are immutable: one key per shard avoids concurrent writers, while the
      # commit sha lets each run publish newly compiled HLOs.
      - name: Restore JAX compilation cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.jax_test_cache
          key: jax-test-cache-${{ matrix.shard }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-test-cache-${{ matrix.shard }}-${{ hashFiles('uv.lock') }}-
            jax-test-cache-${{ matrix.shard }}-
            jax-test-cache-

      - name: Run basedpyright
        run: uv run basedpyright

      - name: Run ruff lint
        run: uv run ruff check --fix-only .

      - name: Run ruff format
        run: uv run ruff format .

      # Disable core dumps: one process holding eight simulated devices' executables
      # can dump multiple GB and leave no room to save the compile cache.
      - name: Run tests
        run: |
          ulimit -c 0
          make test-ci-${{ matrix.shard }}
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          HF_HOME: ${{ github.workspace }}/.hf-cache

      # Retain compiles completed before a test failure.
      - name: Save JAX compilation cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.jax_test_cache
          key: jax-test-cache-${{ matrix.shard }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
