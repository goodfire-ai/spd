# Qwen3.6-35B-A3B MoE compact reference with mesh {data: 8, tp: 8}.
run_name: jax-qwen36-35b-cpe128-b32
cadence:
  train_log_every: 5
  checkpointing:
    kind: periodic
    save_every: 250
    retention:
      kind: keep_last
      n: 1
data:
  train:
    kind: name
    name: fineweb_qwen36_tok_512_train1
  eval:
    kind: name
    name: fineweb_qwen36_tok_512_eval1
eval:
  batch_size: 8
  every: 100
  metrics:
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - coeff: null
    init: random
    source_shape: c
    n_steps: 10
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 100000
  slow_on_first_step: false
decomposition:
  sites:
    kind: qwen36_moe
    layers:
      kind: all
    cs:
      experts_gate: 32768
      experts_up: 32768
      experts_down: 32768
      shared_gate: 2048
      shared_up: 2048
      shared_down: 2048
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    d_model: 2048
    n_blocks: 2
    attention:
      kind: mha
      n_heads: 16
    ffn:
      kind: gelu
      hidden: 8192
pd:
  batch_size: 32
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 65536
    coeff: 5.0e-06
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.2}
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
    source_shape: sc
    type: PersistentPGDReconLoss
  - coeff: 1.0e+03
    type: FaithfulnessLoss
  seed: 0
  steps: 500
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  sharding: zero1-replicated-resident-moe
  mesh:
    data: 8
    tp: 8
  remat_recon_forwards: true
  remat_ci_fn: true
  compiler_options: tuned-v2-autotune1
target:
  experts_execution: dense
  attention_implementation: xla
  weights_dtype: bfloat16
  output_edge:
    kind: streamed
    n_vocab_chunks: 32
  spec:
    kind: hf
    model_class: transformers.Qwen3_5MoeForCausalLM
    model_name: Qwen/Qwen3.6-35B-A3B
wandb:
  entity: null
  project: param-decomp-qwen36
  group: qwen36-reference
  tags:
  - qwen36-moe
  - qwen36
  - compact-reference
  - dp8tp8
  - seq512
