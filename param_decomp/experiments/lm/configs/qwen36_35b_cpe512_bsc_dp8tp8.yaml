# Qwen3.6-35B-A3B MoE large-capacity reference with per-example sources.
run_name: jax-qwen36-35b-cpe512-bsc
cadence:
  train_log_every: 10
  checkpointing:
    kind: periodic
    save_every: 2500
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: fineweb_qwen36_tok_512_train14
  eval:
    kind: name
    name: fineweb_qwen36_tok_512_eval1
eval:
  batch_size: 8
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      experts_gate:
      - layers.*.mlp.experts.gate_proj
      experts_up:
      - layers.*.mlp.experts.up_proj
      experts_down:
      - layers.*.mlp.experts.down_proj
      shared:
      - layers.*.mlp.shared_expert.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: qwen36_moe
    layers:
      kind: all
    cs:
      experts_gate: 131072
      experts_up: 131072
      experts_down: 131072
      shared_gate: 4096
      shared_up: 4096
      shared_down: 4096
  ci:
    type: moe_chunkwise_transformer
    blocks_per_chunk: 4
    d_model: 2048
    n_blocks: 2
    attention:
      kind: mha
      n_heads: 16
    expert_ffn_hidden: 512
    shared_ffn_hidden: 512
pd:
  batch_size: 32
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - coeff: 5.0e-06
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.01}
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      type: momentum_sgd
      momentum: 0.9
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
    source_shape: bsc
    source_dtype: uint16
    type: PersistentPGDReconLoss
  - coeff: 1.0e+03
    type: FaithfulnessLoss
  seed: 0
  steps: 400000
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  sharding: owner-replicated-resident-moe
  mesh:
    data: 8
    tp: 8
  remat_recon_forwards: true
  remat_ci_fn: true
  compiler_options:
    xla_gpu_enable_latency_hiding_scheduler: true
    xla_gpu_enable_triton_gemm: false
    xla_gpu_enable_highest_priority_async_stream: true
    xla_gpu_all_reduce_combine_threshold_bytes: 1073741824
    xla_gpu_all_gather_combine_threshold_bytes: 1073741824
    xla_gpu_reduce_scatter_combine_threshold_bytes: 134217728
    xla_gpu_enable_while_loop_double_buffering: false
    xla_gpu_enable_all_gather_combine_by_dim: false
    xla_gpu_enable_reduce_scatter_combine_by_dim: false
    xla_gpu_autotune_level: 1
    xla_gpu_enable_command_buffer: "FUSION,CUBLAS,CUBLASLT,CUDNN,CUSTOM_CALL,DYNAMIC_SLICE_FUSION,CONDITIONAL"
target:
  experts_execution: routed
  attention_implementation: xla
  output_edge:
    kind: streamed
    n_vocab_chunks: 32
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.Qwen3_5MoeForCausalLM
    model_name: Qwen/Qwen3.6-35B-A3B
wandb:
  entity: null
  project: param-decomp-qwen36
  group: qwen36-reference
  tags:
  - qwen36-moe
  - large-capacity
  - narrow-emission
  - bsc-sources
  - dp8tp8
  - seq512
