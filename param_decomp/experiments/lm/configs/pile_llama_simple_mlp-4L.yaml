# Current JAX reference for decomposing the 4-layer Pile LlamaSimpleMLP target from
# the VPD paper. It carries the recipe and coefficients of the completed reference run
# https://wandb.ai/goodfire/param-decomp/runs/p-8383f5e5 at 400k steps (the run trained 800k):
# the Muon recipe with
# neuron-aligned initialization, frequency EMA, relative per-site faithfulness, and a
# settled final 10% where gamma and both main learning rates remain constant.
# The paper artifact https://wandb.ai/goodfire/spd/runs/s-55ea3f9b remains the exact
# historical PyTorch decomposition.
#
# Run inside a one-node, 8-GPU allocation:
#   python -m param_decomp.experiments.lm.run param_decomp/experiments/lm/configs/pile_llama_simple_mlp-4L.yaml
run_name: pile4l-canonical
cadence:
  train_log_every: 200
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: pile_neox_tok_512
  eval:
    kind: name
    name: pile_neox_tok_512_val
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    hidden_acts_reconstruction:
      coeff: 0.0
      points:
      - resid.1
      - resid.2
      - resid.3
      - resid.4
    type: PGDReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 40
    name: PGDReconLoss_40step
    step_size: 0.1
    type: SlowPGDReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 80
    name: PGDReconLoss_80step
    step_size: 0.1
    type: SlowPGDReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 160
    name: PGDReconLoss_160step
    step_size: 0.1
    type: SlowPGDReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 320
    name: PGDReconLoss_320step
    step_size: 0.1
    type: SlowPGDReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 640
    name: PGDReconLoss_640step
    step_size: 0.1
    type: SlowPGDReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 1280
    name: PGDReconLoss_1280step
    step_size: 0.1
    type: SlowPGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: simple_mlp
    layers:
      kind: all
    cs:
      q_proj: 768
      k_proj: 768
      v_proj: 768
      o_proj: 768
      c_fc: 3072
      down_proj: 3072
    initialization: neuron_aligned
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    input_tap: all_block_resids
    d_model: 2048
    n_blocks: 8
    attention:
      kind: mha
      n_heads: 16
    ffn:
      kind: gelu
      hidden: 8192
pd:
  batch_size: 64
  steps: 400000
  ci_fn_optimizer:
    type: muon
    consistent_rms: 0.2
    grad_clip_norm: 1.0
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.9, frac: 0.1, interp: cosine}
        - {at: 1.0, frac: 0.1}
  components_optimizer:
    type: muon
    consistent_rms: 0.2
    grad_clip_norm: 1.0
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.9, frac: 0.1, interp: cosine}
        - {at: 1.0, frac: 0.1}
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 6.6e-05
      reference_datapoint_count: 6553600
      ema_halflife_steps: 200
    coeff: 2.0e-04
    type: ImportanceMinimalityLoss
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 0.9, frac: 0.01}
        - {at: 1.0, frac: 0.01}
  - type: NonlinearityLocalityLoss
    coeff: 3.0e-05
    relative_threshold:
      max_val: 8.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.25}
    unit_kind_coefficients:
      neuron: 1.0
      attention_head: 1.0
  - type: MergedStochasticSubsetPooledPPGDReconLoss
    coeff: 1.0
    adv_fraction: 0.5
    pool_size: 2064
    n_warmup_steps: 2
    routing:
      type: uniform_k_subset
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.02
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
  - coeff: 1.0e+03
    type: FaithfulnessLoss
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: false
  remat_ci_fn: false
  mesh:
    replicate: 1
    fsdp: 8
    tp: 1
  sharding: owner
  compiler_options: tuned-v2
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  output_edge:
    kind: materialized
  spec:
    kind: pretrained
    model_class: param_decomp.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
wandb:
  entity: null
  project: param-decomp
